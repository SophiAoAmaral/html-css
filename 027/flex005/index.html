<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body{
            background-color: lightpink;

        }
        main{
            background-color: lightblue;
            height: 90vh;
            width: 90vh;
            display: flex; /* SEMPRE DEVE ESTAR NO ELEMENTO PAI PARA AS OUTRAS CONFIGS PEGAREM*/
            flex-flow: row nowrap;

           /* CENTRALIZA NO MEIO DA TELA INDEPENDENTE DO TAMANHO DA TELA */
            justify-content: center;
            align-items: center;
        }
        section{
            background-color: lightcyan;
            height: 200px;
            width: 200px;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</body>
</html>
