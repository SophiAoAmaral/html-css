<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            background-color: lightsalmon;
            flex-flow: row nowrap;
            display: flex;
        }
        .item{
            background-color: lightblue;
            border: 1px solid black;
            flex-basis: 250px;
         

            
        }
        #cxA{
            flex-grow: 0; /*PODE3 AUMENTAR SIM*/
            flex-shrink: 0; 
        }
        #cxB{
            flex-grow: 0;
            flex-shrink: 0;
        }
        #cxC{
             flex-grow: 0; /*VAI AUMENTAR 8 VEZES REFERENTE AO PRIMEIRO FALOR NO EXEMPLO 1*/
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
       
        
    </div>
</body>
</html>
