<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />


   
</head>
<body>
    <main>
        <section>
            <div id="imagem">
                <img src="metal.jpg" alt="">
            </div>

            <div id="formulario">
                <h2>Login</h2>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

                <form action="">
                   <div id="email">
                       
                            <span class="material-symbols-outlined" id="user">
                                person
                            </span>
                            <input type="email" name="email" id="iemail" placeholder="seu e-mail">
                            <label for="email">Login</label>
                       
                   </div>
                    <p>
                        <span class="material-symbols-outlined">                    key
                        </span>
                        <input type="password" name="senha" id="isenha">
                    </p>
                    <p>
                    <input type="submit" value="Entrar">
                    <p><a href="#">Esqueci minha senha</a></p>
                    </p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
