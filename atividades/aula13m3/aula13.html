<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }
        th, td{
            border:1px solid black;
            padding: 8px;
        }
        .cnome{
            background-color: pink;
        }
        .cidade{
            background-color: hotpink;
        }
    </style>
</head>
<body>
    <h1>Exercicio de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissao</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Medica</td>
        </tr>
        <tr>
            <td>Julia</td>
            <td>F</td>
            <td>25</td>
            <td>Veterinaria</td>
        </tr>
        <tr>
            <td>Joao</td>
            <td>M</td>
            <td>34</td>
            <td>Mecanico</td>
        </tr>
        <tr>
            <td>Isabella</td>
            <td>F</td>
            <td>21</td>
            <td>Modelo</td>
        </tr>
        <tr>
            <td>Maria Luiza</td>
            <td>F</td>
            <td>19</td>
            <td>Bancaria</td>
        </tr>
    </table>
</body>
</html>
