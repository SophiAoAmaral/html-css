<!DOCTYPE html>
<html lang="ppt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tete de Formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on" >
        <p>
            <label for="iusu">Usuaio:</label>
            <input type="text" name="usu" id="iusu" required autocomplete="username" minlength="5">
        </p>
        <p>
            <label for="isen">Senha:</label>
            <input type="password" name="sen" id="isen" required minlength="6" maxlength="20" placeholder="digite sua senha" autocomplete="current-password"> 
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
